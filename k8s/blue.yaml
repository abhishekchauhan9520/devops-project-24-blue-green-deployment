apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-blue
  labels:
    app: demo
    color: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo
      color: blue
  template:
    metadata:
      labels:
        app: demo
        color: blue
    spec:
      containers:
        - name: app
          image: blue-green-demo:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_VERSION
              value: v1
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
